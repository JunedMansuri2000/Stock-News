# Runs every 10 minutes — free alternative to Vercel Pro crons.
# Set APP_URL in repo Settings → Secrets → Actions (e.g. https://your-app.vercel.app)
name: News Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/news/sync")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "409" ]; then
            echo "Sync failed with status $STATUS"
            exit 1
          fi
