# GitHub Actions cron — runs every 10 minutes
# Set APP_URL and SYNC_SECRET in repo Settings → Secrets → Actions
name: News Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/news/sync" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "409" ]; then
            echo "Sync request failed with status $STATUS"
            exit 1
          fi
